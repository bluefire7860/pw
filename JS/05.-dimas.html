<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Login Page</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            height: 100vh;
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            background: white;
            padding: 30px;
            width: 350px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        .card h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #333;
        }

        .input-group {
            margin-bottom: 15px;
        }

        .input-group label {
            font-size: 14px;
            display: block;
            margin-bottom: 5px;
        }

        .input-group input {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #ccc;
            outline: none;
            transition: 0.3s;
        }

        .input-group input:focus {
            border-color: #4facfe;
        }

        .btn-group {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
        }

        .btn {
            width: 48%;
            padding: 10px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }

        .login-btn {
            background: #4facfe;
            color: white;
        }

        .login-btn:hover {
            background: #2e8bff;
        }

        .reset-btn {
            background: #eee;
        }

        .reset-btn:hover {
            background: #ddd;
        }

        .footer {
            text-align: center;
            margin-top: 15px;
            font-size: 12px;
            color: #777;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Form Login</h2>

        <form>
            <div class="input-group">
                <label>Email</label>
                <input type="text" placeholder="Masukkan Email">
            </div>

            <div class="input-group">
                <label>Password</label>
                <input type="password" placeholder="Masukkan Password">
            </div>

            <div class="btn-group">
                <button type="submit" class="btn login-btn">Sign In</button>
                <button type="reset" class="btn reset-btn">Reset</button>
            </div>
        </form>

        <div class="footer">
            © 2026 Login System
        </div>
    </div>

</body>
</html>
