<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Modern</title>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #a5d6a7, #66bb6a);
        }

        .login-container {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            width: 320px;
            text-align: center;
            transition: 0.3s;
        }

        .login-container:hover {
            transform: translateY(-5px);
        }

        h2 {
            margin-bottom: 20px;
            color: #2e7d32;
        }

        .input-group {
            text-align: left;
            margin-bottom: 15px;
        }

        label {
            font-weight: 600;
            font-size: 13px;
            color: #444;
        }

        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
            margin-top: 5px;
            transition: 0.3s;
            outline: none;
        }

        input:focus {
            border-color: #2e7d32;
            box-shadow: 0 0 8px rgba(46,125,50,0.3);
        }

        .button-group {
            margin-top: 20px;
            display: flex;
            gap: 10px;
        }

        button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }

        #BtnLogin {
            background: linear-gradient(135deg, #43a047, #2e7d32);
            color: white;
        }

        #BtnLogin:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        #BtnCancel {
            background: linear-gradient(135deg, #e53935, #c62828);
            color: white;
        }

        #BtnCancel:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .message {
            margin-top: 10px;
            font-size: 13px;
            color: red;
        }
    </style>
</head>

<body>

    <div class="login-container">
        <h2>Login Form</h2>

        <div class="input-group">
            <label>👤 Username</label>
            <input type="text" id="U3" placeholder="Masukkan Username">
        </div>

        <div class="input-group">
            <label>🔒 Password</label>
            <input type="password" id="pass" placeholder="Masukkan Password">
        </div>

        <div class="button-group">
            <button id="BtnLogin">Login</button>
            <button id="BtnCancel">Cancel</button>
        </div>

        <div class="message" id="msg"></div>
    </div>

    <script>
        let btnLogin = document.getElementById("BtnLogin");
        let btnCancel = document.getElementById("BtnCancel");
        let us = document.getElementById("U3");
        let ps = document.getElementById("pass");
        let msg = document.getElementById("msg");

        btnLogin.addEventListener("click", function() {
            let username = us.value.trim();
            let password = ps.value.trim();

            if (username === "" || password === "") {
                msg.textContent = "Username dan Password wajib diisi!";
                return;
            }

            // simulasi login sederhana
            if (username === "admin" && password === "123") {
                msg.style.color = "green";
                msg.textContent = "Login berhasil! Selamat datang " + username;
            } else {
                msg.style.color = "red";
                msg.textContent = "Username atau Password salah!";
            }
        });

        btnCancel.onclick = function() {
            us.value = "";
            ps.value = "";
            msg.textContent = "";
        };

        // tekan ENTER untuk login
        document.addEventListener("keypress", function(e) {
            if (e.key === "Enter") {
                btnLogin.click();
            }
        });
    </script>

</body>
</html>
