<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Pengguna - GAME ZONE</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bg-primary: #0a0a0e;
            --bg-secondary: #14141e;
            --bg-surface: #1e1e2d;
            --text-primary: #ffffff;
            --text-secondary: #b0b0b0;
            --accent: #00e5ff;
            --accent-hover: #00b8cc;
            --danger: #ff1744;
            --danger-hover: #cc1236;
            --border-color: #2e2e42;
            --font-main: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            --font-game: 'Changa', sans-serif;
        }

        @import url('https://fonts.googleapis.com/css2?family=Changa:wght@400;700&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: var(--font-main);
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            padding: 2rem;
            display: flex;
            justify-content: center;
        }

        .main-title {
            text-align: center;
            font-family: var(--font-game);
            font-size: 2.5rem;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 2rem;
            text-shadow: 0 0 10px var(--accent);
        }

        .container {
            width: 100%;
            max-width: 1200px;
            display: grid;
            grid-template-columns: 1fr;
            gap: 2rem;
        }

        @media (min-width: 768px) {
            .container {
                grid-template-columns: 350px 1fr;
            }
        }

        .card {
            background-color: var(--bg-secondary);
            border: 2px solid var(--border-color);
            border-radius: 8px;
            padding: 1.5rem;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            transition: border-color 0.3s ease;
        }

        .card:hover {
            border-color: var(--accent);
        }

        h2 {
            margin-bottom: 1.5rem;
            font-size: 1.25rem;
            color: var(--text-primary);
            padding-bottom: 0.5rem;
            font-family: var(--font-game);
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        h2 i {
            color: var(--accent);
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-secondary);
            font-size: 0.875rem;
            text-transform: capitalize;
        }

        input, select {
            width: 100%;
            padding: 0.75rem;
            background-color: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            color: var(--text-primary);
            font-size: 1rem;
            transition: all 0.2s;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 5px var(--accent);
        }

        .btn-group {
            display: flex;
            gap: 0.75rem;
            margin-top: 1.5rem;
        }

        button {
            flex: 1;
            padding: 0.75rem;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            cursor: pointer;
            font-weight: 700;
            text-transform: uppercase;
            transition: background-color 0.2s, transform 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            font-family: var(--font-game);
        }

        button:active {
            transform: scale(0.98);
        }

        .btn-primary {
            background-color: var(--accent);
            color: var(--bg-primary);
        }

        .btn-primary:hover {
            background-color: var(--accent-hover);
        }

        .btn-secondary {
            background-color: var(--bg-surface);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover {
            background-color: var(--border-color);
        }

        .btn-danger {
            background-color: transparent;
            color: var(--danger);
            border: 2px solid var(--danger);
            padding: 0.25rem 0.75rem;
            font-size: 0.875rem;
            border-radius: 4px;
        }

        .btn-danger:hover {
            background-color: var(--danger);
            color: var(--text-primary);
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th, td {
            padding: 1rem;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            background-color: var(--bg-surface);
            color: var(--accent);
            font-weight: 700;
            text-transform: capitalize;
            font-family: var(--font-game);
        }

        tbody tr {
            cursor: pointer;
            transition: background-color 0.2s;
        }

        tbody tr:hover {
            background-color: rgba(0, 229, 255, 0.05);
        }

        .actions-cell {
            text-align: right;
        }
    </style>
</head>
<body>

    <div>
        <h1 class="main-title"><i class="fas fa-gamepad"></i> GameZone User Profile <i class="fas fa-headset"></i></h1>
        <div class="container">
            <div class="card">
                <h2 id="form-title"><i class="fas fa-user-plus"></i> Tambah Pengguna</h2>
                <form id="crud-form">
                    <div id="dynamic-fields"></div>
                    <div class="btn-group">
                        <button type="submit" class="btn-primary" id="btn-submit"><i class="fas fa-save"></i> Simpan</button>
                        <button type="button" class="btn-secondary" id="btn-reset"><i class="fas fa-times"></i> Batal</button>
                    </div>
                </form>
            </div>

            <div class="card">
                <h2><i class="fas fa-list"></i> Data Pengguna</h2>
                <div class="table-container">
                    <table id="data-table">
                        <thead>
                            <tr id="table-header"></tr>
                        </thead>
                        <tbody id="table-body"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Skema data - 'id' tidak ditampilkan di form, tetapi ditampilkan di tabel
        const SCHEMA = [
            { key: 'id', label: 'ID', type: 'text', showInForm: false, showInTable: true, icon: 'fas fa-hash' },
            { key: 'pengguna', label: 'Pengguna', type: 'text', required: true, showInForm: true, showInTable: true, icon: 'fas fa-user-tag' },
            { key: 'nama', label: 'Nama', type: 'text', required: true, showInForm: true, showInTable: true, icon: 'fas fa-id-card' },
            { key: 'sandi', label: 'Sandi', type: 'password', required: true, showInForm: true, showInTable: false, icon: 'fas fa-lock' },
            { key: 'status', label: 'Status', type: 'select', options: ['Online', 'Away', 'Offline'], required: true, showInForm: true, showInTable: true, icon: 'fas fa-signal' }
        ];

        const STORAGE_KEY = 'crud_user_app';

        const AppStorage = {
            get: () => JSON.parse(localStorage.getItem(STORAGE_KEY)) || [],
            save: (data) => localStorage.setItem(STORAGE_KEY, JSON.stringify(data))
        };

        const FormBuilder = {
            render: (containerId) => {
                const container = document.getElementById(containerId);
                container.innerHTML = SCHEMA.filter(field => field.showInForm).map(field => {
                    const iconHTML = `<i class="${field.icon}" style="color: var(--accent); margin-right: 0.5rem;"></i>`;
                    if (field.type === 'select') {
                        return `
                            <div class="form-group">
                                <label for="field-${field.key}">${iconHTML}${field.label}</label>
                                <select id="field-${field.key}" ${field.required ? 'required' : ''}>
                                    <option value="">Pilih ${field.label}</option>
                                    ${field.options.map(opt => `<option value="${opt}">${opt}</option>`).join('')}
                                </select>
                            </div>
                        `;
                    }
                    return `
                        <div class="form-group">
                            <label for="field-${field.key}">${iconHTML}${field.label}</label>
                            <input type="${field.type}" id="field-${field.key}" ${field.required ? 'required' : ''}>
                        </div>
                    `;
                }).join('');
            },
            
            getValues: () => {
                const data = {};
                SCHEMA.filter(field => field.showInForm).forEach(field => {
                    data[field.key] = document.getElementById(`field-${field.key}`).value;
                });
                return data;
            },

            setValues: (data) => {
                SCHEMA.filter(field => field.showInForm).forEach(field => {
                    const inputElement = document.getElementById(`field-${field.key}`);
                    if (inputElement) {
                        inputElement.value = data[field.key] || '';
                    }
                });
                // Simpan ID yang dipilih secara tersembunyi untuk proses update
                App.currentEditId = data.id || null;
            },

            clear: () => {
                SCHEMA.filter(field => field.showInForm).forEach(field => {
                    const inputElement = document.getElementById(`field-${field.key}`);
                    if (inputElement) {
                        inputElement.value = '';
                    }
                });
                App.currentEditId = null;
            }
        };

        const TableBuilder = {
            renderHeader: (headerId) => {
                const headerRow = document.getElementById(headerId);
                const columns = SCHEMA.filter(f => f.showInTable).map(f => `<th>${f.label}</th>`);
                columns.push('<th class="actions-cell">Aksi</th>');
                headerRow.innerHTML = columns.join('');
            },

            renderBody: (bodyId, data, onRowClick, onDeleteClick) => {
                const tbody = document.getElementById(bodyId);
                if (data.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="${SCHEMA.filter(f => f.showInTable).length + 1}" style="text-align:center; color:var(--text-secondary);"><i class="fas fa-folder-open"></i> Tidak ada data</td></tr>`;
                    return;
                }

                tbody.innerHTML = data.map(item => {
                    const cells = SCHEMA.filter(f => f.showInTable).map(f => `<td>${item[f.key] || ''}</td>`).join('');
                    return `
                        <tr data-id="${item.id}">
                            ${cells}
                            <td class="actions-cell" onclick="event.stopPropagation()">
                                <button class="btn-danger" data-id="${item.id}"><i class="fas fa-trash-alt"></i> Hapus</button>
                            </td>
                        </tr>
                    `;
                }).join('');

                tbody.querySelectorAll('tr').forEach(tr => {
                    tr.addEventListener('click', () => {
                        const id = tr.getAttribute('data-id');
                        onRowClick(id);
                    });
                });

                tbody.querySelectorAll('.btn-danger').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        const id = btn.getAttribute('data-id');
                        onDeleteClick(id);
                    });
                });
            }
        };

        const App = {
            isEditMode: false,
            currentEditId: null,

            init: () => {
                FormBuilder.render('dynamic-fields');
                TableBuilder.renderHeader('table-header');
                App.refreshView();
                App.bindEvents();
            },

            refreshView: () => {
                const data = AppStorage.get();
                TableBuilder.renderBody('table-body', data, App.handleSelectRow, App.handleDelete);
            },

            bindEvents: () => {
                document.getElementById('crud-form').addEventListener('submit', App.handleSave);
                document.getElementById('btn-reset').addEventListener('click', App.resetFormState);
            },

            handleSave: (e) => {
                e.preventDefault();
                const formData = FormBuilder.getValues();
                let currentData = AppStorage.get();

                if (App.isEditMode && App.currentEditId) {
                    // Update data yang sudah ada
                    currentData = currentData.map(item => {
                        if (item.id === App.currentEditId) {
                            // Pertahankan ID asli
                            return { ...formData, id: item.id };
                        }
                        return item;
                    });
                } else {
                    // Generate ID otomatis untuk data baru
                    const uniqueId = '#' + Date.now().toString().slice(-4) + Math.random().toString(16).slice(-2);
                    currentData.push({ ...formData, id: uniqueId });
                }

                AppStorage.save(currentData);
                App.refreshView();
                App.resetFormState();
            },

            handleSelectRow: (id) => {
                const currentData = AppStorage.get();
                const selectedItem = currentData.find(item => item.id === id);
                if (selectedItem) {
                    FormBuilder.setValues(selectedItem);
                    App.isEditMode = true;
                    document.getElementById('form-title').innerHTML = '<i class="fas fa-user-edit"></i> Ubah Pengguna';
                    document.getElementById('btn-submit').innerHTML = '<i class="fas fa-sync-alt"></i> Perbarui';
                }
            },

            handleDelete: (id) => {
                if (confirm('Game Over! Apakah Anda yakin ingin menghapus data ini?')) {
                    let currentData = AppStorage.get();
                    currentData = currentData.filter(item => item.id !== id);
                    AppStorage.save(currentData);
                    App.refreshView();
                    App.resetFormState();
                }
            },

            resetFormState: () => {
                FormBuilder.clear();
                App.isEditMode = false;
                document.getElementById('form-title').innerHTML = '<i class="fas fa-user-plus"></i> Tambah Pengguna';
                document.getElementById('btn-submit').innerHTML = '<i class="fas fa-save"></i> Simpan';
            }
        };

        document.addEventListener('DOMContentLoaded', App.init);
    </script>
</body>
</html>
